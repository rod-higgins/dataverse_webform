services:
  dataverse_webform.azure_auth:
    class: Drupal\dataverse_webform\AzureAdAuthService
    arguments: 
      - '@http_client_factory'
      - '@logger.factory'
      - '@state'
      - '@key.repository'
      - '@lock'
  
  dataverse_webform.cache_manager:
    class: Drupal\dataverse_webform\Cache\DataverseCacheManager
    arguments:
      - '@cache.default'
      - '@config.factory'
      - '@logger.factory'
  
  dataverse_webform.validator:
    class: Drupal\dataverse_webform\ValidationService
    arguments:
      - '@logger.factory'

  dataverse_webform.submission_processor:
    class: Drupal\dataverse_webform\SubmissionProcessor
    arguments:
      - '@logger.factory'
      - '@dataverse_webform.validator'

  dataverse_webform.config_manager:
    class: Drupal\dataverse_webform\ConfigurationManager
    arguments:
      - '@key.repository'
      - '@dataverse_webform.validator'
  
  dataverse_webform.dataverse_client:
    class: Drupal\dataverse_webform\DataverseClient
    arguments: 
      - '@http_client_factory'
      - '@logger.factory'
      - '@dataverse_webform.azure_auth'
      - '@dataverse_webform.cache_manager'
      - '@dataverse_webform.validator'
      - '@dataverse_webform.submission_processor'
      - '@config.factory'
      - '@state'
      - '@current_user'

  dataverse_webform.submission_handler:
    class: Drupal\dataverse_webform\Service\WebformSubmissionHandler
    arguments:
      - '@dataverse_webform.dataverse_client'
      - '@logger.factory'
      - '@config.factory'
      - '@state'
      - '@queue'
      - '@current_user'
      - '@dataverse_webform.cache_manager'

  dataverse_webform.form_builder:
    class: Drupal\dataverse_webform\Form\WebformSettingsFormBuilder
    arguments:
      - '@dataverse_webform.config_manager'
      - '@dataverse_webform.dataverse_client'
      - '@dataverse_webform.cache_manager'
      - '@logger.factory'
      - '@module_handler'