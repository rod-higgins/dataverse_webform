dataverse_webform.test:
  path: '/admin/config/services/dataverse/test'
  defaults:
    _form: '\Drupal\dataverse_webform\Form\DataverseTestForm'
    _title: 'Test Dataverse Connection'
  requirements:
    _permission: 'administer dataverse webform'

dataverse_webform.entity_fields_ajax:
  path: '/admin/dataverse/ajax/entity-fields'
  defaults:
    _controller: '\Drupal\dataverse_webform\Controller\DataverseAjaxController::getEntityFields'
  methods: [GET]
  requirements:
    _permission: 'administer dataverse webform'

dataverse_webform.entities_ajax:
  path: '/admin/dataverse/ajax/entities'
  defaults:
    _controller: '\Drupal\dataverse_webform\Controller\DataverseAjaxController::getEntities'
  methods: [GET]
  requirements:
    _permission: 'administer dataverse webform'

dataverse_webform.validate_config_ajax:
  path: '/admin/dataverse/ajax/validate-config'
  defaults:
    _controller: '\Drupal\dataverse_webform\Controller\DataverseAjaxController::validateConfiguration'
  methods: [POST]
  requirements:
    _permission: 'administer dataverse webform'